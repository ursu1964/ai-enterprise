services:
  runtime-init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    user: "0:0"
    command:
      [
        "python",
        "-m",
        "ai_enterprise.bootstrap",
        "--runtime-root",
        "/runtime-data",
        "--owned-path",
        "/artifacts",
        "--owned-path",
        "/integration-work",
        "--owned-path",
        "/recovery-work",
        "--owner-uid",
        "${HOST_UID:-1000}",
        "--owner-gid",
        "${HOST_GID:-1000}",
        "--paths-only"
      ]
    volumes:
      - ./runtime-data:/runtime-data
      - ./artifacts:/artifacts
      - integration-work:/integration-work
      - recovery-work:/recovery-work
      - ./apps/api/src:/app/src:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    restart: "no"

  bootstrap:
    profiles: ["dev-bootstrap"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "ai_enterprise.bootstrap", "--runtime-root", "/runtime-data"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_enterprise:ai_enterprise_dev@postgres:5432/ai_enterprise
    volumes:
      - ./runtime-data:/runtime-data
      - ./apps/api/src:/app/src:ro
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: "no"

  postgres:
    image: postgres:17
    container_name: ai-enterprise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_enterprise
      POSTGRES_USER: ai_enterprise
      POSTGRES_PASSWORD: ai_enterprise_dev
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ai_enterprise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ai_enterprise -d ai_enterprise"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_enterprise:ai_enterprise_dev@postgres:5432/ai_enterprise
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-enterprise-api
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_enterprise:ai_enterprise_dev@postgres:5432/ai_enterprise
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      XDG_DATA_HOME: /tmp/.local/share
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/api/src:/app/src:ro
      - ./artifacts:/app/artifacts
      - ./graphify-out:/app/graphify-out:ro
      - ./runtime-data:/app/runtime-data
      - ${REPOSITORY_ALLOWED_ROOT:-/home/user/projects}:${REPOSITORY_ALLOWED_ROOT:-/home/user/projects}
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-enterprise-worker
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "ai_enterprise.worker"
      ]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_enterprise:ai_enterprise_dev@postgres:5432/ai_enterprise
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WORKER_PROFILE: general
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      XDG_DATA_HOME: /tmp/.local/share
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/api/src:/app/src
      - ./artifacts:/app/artifacts
      - ./runtime-data:/app/runtime-data
      - ${REPOSITORY_ALLOWED_ROOT:-/home/user/projects}:${REPOSITORY_ALLOWED_ROOT:-/home/user/projects}
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  integration-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-enterprise-integration-worker
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "ai_enterprise.integration_worker"
      ]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_enterprise:ai_enterprise_dev@postgres:5432/ai_enterprise
      WORKER_PROFILE: integration
      INTEGRATION_WORK_ROOT: /integration-work
      # Scratch output belongs on the writable work volume; evidence inputs stay read-only.
      INTEGRATION_ARTIFACTS_ROOT: /integration-work/runtime
      INTEGRATION_SSH_CONFIG_PATH: /run/secrets/integration_ssh_config
      GIT_TERMINAL_PROMPT: "0"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      XDG_DATA_HOME: /tmp/.local/share
    secrets:
      - integration_ssh_config
    volumes:
      - integration-work:/integration-work
      - ./artifacts:/artifacts:ro
      - ./apps/api/src:/app/src:ro
      - ${REPOSITORY_ALLOWED_ROOT:-/home/user/projects}:${REPOSITORY_ALLOWED_ROOT:-/home/user/projects}
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  recovery-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-enterprise-recovery-worker
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "ai_enterprise.recovery_worker"
      ]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_enterprise:ai_enterprise_dev@postgres:5432/ai_enterprise
      WORKER_PROFILE: recovery
      RECOVERY_WORK_ROOT: /recovery-work
      # Scratch output belongs on the writable work volume; evidence inputs stay read-only.
      RECOVERY_ARTIFACTS_ROOT: /recovery-work/runtime
      RECOVERY_SSH_CONFIG_PATH: /run/secrets/integration_ssh_config
      GIT_TERMINAL_PROMPT: "0"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      XDG_DATA_HOME: /tmp/.local/share
    secrets:
      - integration_ssh_config
    volumes:
      - recovery-work:/recovery-work
      - ./artifacts:/artifacts:ro
      - ./apps/api/src:/app/src:ro
      - ${REPOSITORY_ALLOWED_ROOT:-/home/user/projects}:${REPOSITORY_ALLOWED_ROOT:-/home/user/projects}
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: ai-enterprise-ollama
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 8g
    cpus: 4.0

volumes:
  ai_enterprise_postgres_data:
  integration-work:
  recovery-work:
  ollama-data:

secrets:
  integration_ssh_config:
    file: ./docker/dev-integration-ssh-config

name: Engineering Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  specification-and-quality-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_enterprise
          POSTGRES_PASSWORD: ai_enterprise_dev
          POSTGRES_DB: ai_enterprise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_enterprise -d ai_enterprise"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://ai_enterprise:ai_enterprise_dev@localhost:5432/ai_enterprise
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install application and verification dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -e ./apps/api
          python -m pip install --group './apps/api/pyproject.toml:dev'
      - name: Apply database migrations
        run: cd apps/api && python -m alembic upgrade head
      - name: Static specification, contract, consistency, and determinism gates
        run: python tools/engineering_verify.py --static --json
      - name: Governed enterprise evolution assessment
        run: python tools/evolution_verify.py --json
      - name: Governed federation conformance
        run: python tools/federation_verify.py --json
      - name: Governed strategic intelligence conformance
        run: python tools/intelligence_verify.py --json
      - name: Tooling invariants
        run: python tools/check_tooling_invariants.py
      - name: Full continuous engineering verification
        run: python tools/engineering_verify.py --full --json
      - name: Install Chromium journey runtime
        run: python -m playwright install --with-deps chromium
      - name: Start dashboard stack
        run: |
          cp .env.example .env
          POSTGRES_HOST_PORT=15432 \
            REPOSITORY_ALLOWED_ROOT="$GITHUB_WORKSPACE" \
            HOST_UID="$(id -u)" \
            HOST_GID="$(id -g)" \
            docker compose up --build -d api
      - name: Wait for dashboard stack
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health/live; then
              docker compose ps
              exit 0
            fi
            docker compose ps
            sleep 5
          done
          mkdir -p artifacts/browser
          docker compose ps > artifacts/browser/docker-compose-ps.txt || true
          docker compose logs --no-color --tail=300 api postgres migrate runtime-init > artifacts/browser/docker-compose.log || true
          exit 1
      - name: Browser dashboard journeys
        run: python tools/dashboard_browser_verify.py --timeout-ms 30000
      - name: Preserve dashboard stack failure evidence
        if: failure()
        run: |
          mkdir -p artifacts/browser
          docker compose ps > artifacts/browser/docker-compose-ps.txt || true
          docker compose logs --no-color --tail=300 api postgres migrate runtime-init > artifacts/browser/docker-compose.log || true
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-evidence
          path: artifacts/browser/
          if-no-files-found: ignore
      - name: Stop dashboard stack
        if: always()
        run: docker compose down
